name = "euler-polyhedron"
defaultTargets = ["EulerPolyhedron"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "09a9e06e4e5ccd5b783f25e52ad3ebecfb1e2d68"

[[require]]
name = "eulers-gem"
git = "https://github.com/tangentproofs/eulers-gem.git"
rev = "02c67906ae6b427f7c5c73fab0c89e7956a8a3c1"
subDir = "lean"

[[lean_lib]]
name = "EulerPolyhedron"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, weak.linter.mathlibStandardSet = true }
